# ============================================================
#  Kafka 스택 — 3-브로커 KRaft 클러스터 (금융 데이터 정합성)
#  실행:  docker compose up -d
#  확인:  http://localhost:8080  (Kafka UI 에서 브로커 3개 + transactions 토픽)
#
#  정합성 설정:
#   - RF=3, min.insync.replicas=2  → 브로커 1대 장애에도 무손실 + 쓰기 지속
#   - unclean.leader.election=false → stale 복제본 리더 승격 차단(커밋분 무손실)
#   - restart=unless-stopped        → 브로커 down 시 자동 회복
#   - named volume                  → 재시작해도 데이터 영속
#  Spark / Airflow / Prometheus / Grafana 는 이후 단계에서 추가
# ============================================================

name: fraud-pipeline

# 3노드 공통 환경변수 (YAML 앵커로 중복 제거)
x-kafka-common: &kafka-common
  image: confluentinc/cp-kafka:7.6.1
  restart: unless-stopped
  networks:
    - fraud-net
  healthcheck:
    test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
    interval: 10s
    timeout: 10s
    retries: 10
    start_period: 25s

x-kafka-env: &kafka-env
  # --- KRaft 모드 (broker + controller 겸용) ---
  KAFKA_PROCESS_ROLES: "broker,controller"
  KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka1:29093,2@kafka2:29093,3@kafka3:29093"
  KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
  CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
  KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
  # --- 금융 정합성: 복제/내구성 ---
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

# Airflow 3개 서비스(init/webserver/scheduler) 공통 설정 — LocalExecutor
x-airflow-common: &airflow-common
  build:
    context: ${HOST_PROJECT_DIR:-.}/airflow
    dockerfile: Dockerfile
  image: fraud-airflow:local
  user: "50000:0"   # airflow UID 50000 + root그룹(GID 0) → docker.sock 접근
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # ⑥ 모니터링: Airflow 운영 메트릭을 StatsD(UDP)로 statsd-exporter에 전송.
    # statsd-exporter(monitoring profile)가 꺼져 있어도 UDP fire-and-forget이라 무해.
    AIRFLOW__METRICS__STATSD_ON: "true"
    AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
    AIRFLOW__METRICS__STATSD_PORT: "9125"
    AIRFLOW__METRICS__STATSD_PREFIX: airflow
    # 주의: HOST_PROJECT_DIR는 컨테이너 env로 주지 않는다. compose는 프로젝트 디렉터리
    # (=이 파일이 있는 루트)의 .env를 자동 로드하므로, 형제 잡(DooD) 실행 시에도 값이 shell env에
    # 가려지지 않고 정확히 전달된다(별도 export 불필요).
    # ── BigQuery(reconcile/push_metrics) 조회용. 프로젝트 마운트에 SA 키 포함 → 별도 마운트 불필요 ──
    GCP_PROJECT_ID: ${GCP_PROJECT_ID:?.env에 GCP_PROJECT_ID를 설정하세요}
    BQ_DATASET_SILVER: ${BQ_DATASET_SILVER:-fraud_silver}
    BQ_DATASET_GOLD: ${BQ_DATASET_GOLD:-fraud_gold}
    # ── E단계: bronze_sensor GCS/BQ 센싱용 ──
    BQ_DATASET_BRONZE: ${BQ_DATASET_BRONZE:-fraud_bronze}
    # step→tx_date 기준시각. producer가 event_time을 만들 때, DAG가 reconcile 교차검증에서
    # step 기준 날짜를 계산할 때 **같은 값**을 써야 한다. 리터럴 기본값은 여기 한 곳에만 둔다
    # (.env에 값이 있으면 그쪽이 우선). 두 곳이 어긋나면 reconcile이 불일치로 잡아낸다.
    # ★ 변경 시 이미 적재된 Bronze의 date= 파티션과 어긋나므로 전량 재적재 필수.
    STEP_EPOCH: ${STEP_EPOCH:-2016-01-01 00:00:00}
    GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/project/credentials/service_account.json
    # ── D단계: Dataproc 제출(DataprocCreateBatchOperator) + GCS 코드 업로드용 ──
    GCP_REGION: ${GCP_REGION:-asia-northeast3}
    GCS_BUCKET_BRONZE: ${GCS_BUCKET_BRONZE:?.env에 GCS_BUCKET_BRONZE를 설정하세요}
    GCS_BUCKET_SILVER: ${GCS_BUCKET_SILVER:?.env에 GCS_BUCKET_SILVER를 설정하세요}
    GCS_BUCKET_STAGING: ${GCS_BUCKET_STAGING:?.env에 GCS_BUCKET_STAGING을 설정하세요}
    GCP_SA_EMAIL: ${GCP_SA_EMAIL:?.env에 GCP_SA_EMAIL을 설정하세요}
    # google 프로바이더 기본 연결이 ADC(GOOGLE_APPLICATION_CREDENTIALS)를 쓰도록 — 별도 커넥션 설정 불필요
    AIRFLOW_CONN_GOOGLE_CLOUD_DEFAULT: "google-cloud-platform://"
  volumes:
    - ${HOST_PROJECT_DIR:-.}/airflow/dags:/opt/airflow/dags
    - ${HOST_PROJECT_DIR:-.}/airflow/logs:/opt/airflow/logs
    - ${HOST_PROJECT_DIR:-.}/airflow/plugins:/opt/airflow/plugins
    - ${HOST_PROJECT_DIR:-.}:/opt/airflow/project   # compose 파일/잡 코드 접근
    - /var/run/docker.sock:/var/run/docker.sock
  networks:
    - fraud-net

services:
  kafka1:
    <<: *kafka-common
    container_name: kafka1
    ports:
      - "9092:9092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka1:29092,PLAINTEXT_HOST://localhost:9092"
    volumes:
      - kafka1-data:/var/lib/kafka/data

  kafka2:
    <<: *kafka-common
    container_name: kafka2
    ports:
      - "9093:9092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka2:29092,PLAINTEXT_HOST://localhost:9093"
    volumes:
      - kafka2-data:/var/lib/kafka/data

  kafka3:
    <<: *kafka-common
    container_name: kafka3
    ports:
      - "9094:9092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka3:29092,PLAINTEXT_HOST://localhost:9094"
    volumes:
      - kafka3-data:/var/lib/kafka/data

  # transactions 토픽 1회 생성(정합성 설정 포함) 후 종료
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-init
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        kafka-topics --bootstrap-server kafka1:29092 --create --if-not-exists \
          --topic transactions --partitions 3 --replication-factor 3 \
          --config min.insync.replicas=2 \
          --config retention.ms=-1 \
          --config unclean.leader.election.enable=false
        echo "=== transactions 토픽 상세 (RF/ISR/min.insync 확인) ==="
        kafka-topics --bootstrap-server kafka1:29092 --describe --topic transactions
    networks:
      - fraud-net

  # ── E단계 수집: Kafka Connect + GCS Sink (상시 인제스트, DAG 밖) ──────────
  # 기동: docker compose --profile connect up -d --build
  # profile=connect 전용(기본 up엔 안 뜸) — SA 키 없는 개발 환경 크래시 방지.
  kafka-connect:
    build:
      context: ${HOST_PROJECT_DIR:-.}/kafka/connect
      dockerfile: Dockerfile
    image: fraud-connect:local
    container_name: kafka-connect
    profiles: ["connect"]
    restart: unless-stopped
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: "kafka1:29092,kafka2:29092,kafka3:29092"
      CONNECT_GROUP_ID: "fraud-connect"
      CONNECT_REST_ADVERTISED_HOST_NAME: "kafka-connect"
      CONNECT_CONFIG_STORAGE_TOPIC: "_connect-configs"
      CONNECT_OFFSET_STORAGE_TOPIC: "_connect-offsets"
      CONNECT_STATUS_STORAGE_TOPIC: "_connect-status"
      # 정합성: 내부 토픽도 RF=3(브로커 1대 장애에도 커넥터 상태/오프셋 무손실)
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 3
      # = offset.flush.interval.ms (CONNECT_ 접두사는 이미지가 워커 프로퍼티로 변환한다).
      # gcs-sink-bronze 의 rotate.schedule.interval.ms(10000)와 **짝**이다 — rotate 는 "파일을
      # 닫을 예정 시각"을 정할 뿐 스스로 실행되지 않고, 그 조건이 참인지 확인하러 오는 주기가
      # 이 값이다. 스트림이 멎으면 회전 판정을 깨우는 유일한 경로라 둘 다 낮춰야 꼬리가
      # 줄어든다 — 꼬리는 위상 의존이라 `상한 = 두 값의 합`, `기대값 = 그 절반`이다:
      # 60000/60000 이던 것을 10000/30000 으로 낮춰 상한 120s→40s, 기대값 60s→20s.
      # 한쪽만 바꾸면 그 항만 줄어 효과가 거의 없다(실측: rotate 만 3s → 꼬리 23s).
      # 근거: PERFORMANCE.md "Q2 규명" / "Part 4".
      CONNECT_OFFSET_FLUSH_INTERVAL_MS: 30000
      CONNECT_KEY_CONVERTER: "org.apache.kafka.connect.storage.StringConverter"
      CONNECT_VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_PLUGIN_PATH: "/usr/share/java,/usr/share/confluent-hub-components"
      GOOGLE_APPLICATION_CREDENTIALS: /credentials/service_account.json
    volumes:
      - ${HOST_PROJECT_DIR:-.}/credentials:/credentials:ro
    networks:
      - fraud-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/connectors"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # gcs-sink-bronze 커넥터를 1회 등록(REST PUT) 후 종료. PUT은 멱등 — 재실행해도 config 갱신만.
  connect-init:
    image: curlimages/curl:latest
    container_name: connect-init
    profiles: ["connect"]
    depends_on:
      kafka-connect:
        condition: service_healthy
    environment:
      # 커넥터 JSON에는 버킷명을 커밋하지 않는다(개인 식별값) — 아래 sed가 POST 직전에 주입.
      GCS_BUCKET_BRONZE: ${GCS_BUCKET_BRONZE:?.env에 GCS_BUCKET_BRONZE를 설정하세요}
    volumes:
      - ${HOST_PROJECT_DIR:-.}/kafka/connect:/config:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      # $$ 는 compose가 아니라 컨테이너 셸이 해석해야 하는 $ 다(compose 변수 치환 회피).
      # /config 는 :ro 마운트라 치환 결과는 /tmp 로 쓴다.
      - |
        sed "s|__GCS_BUCKET_BRONZE__|$$GCS_BUCKET_BRONZE|g" \
          /config/gcs-sink-bronze.json > /tmp/gcs-sink-bronze.json
        curl -sS -X PUT -H "Content-Type: application/json" \
          --data @/tmp/gcs-sink-bronze.json \
          http://kafka-connect:8083/connectors/gcs-sink-bronze/config
    networks:
      - fraud-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "local"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka1:29092,kafka2:29092,kafka3:29092"
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
    networks:
      - fraud-net

  # dbt (Silver → Gold). profile 지정으로 `up`엔 안 뜸.
  # 실행: docker compose run --rm dbt run --profiles-dir .
  #       docker compose run --rm dbt test --profiles-dir .
  dbt:
    build:
      # build context는 CLI(클라이언트)가 tar로 올리므로 '클라이언트 파일시스템' 기준 경로여야
      # 한다. 바인드 마운트(데몬이 해석 → 호스트 절대경로 필요)와는 반대다. 스케줄러 컨테이너
      # 안에서 실행될 때 ./dbt = /opt/airflow/project/dbt 로 정상 해석됨 — HOST_PROJECT_DIR을
      # 쓰면 호스트 경로를 컨테이너 안 CLI에 넘기게 되어 빌드가 깨진다.
      context: ./dbt
      dockerfile: Dockerfile
    image: fraud-dbt:local
    profiles: ["jobs"]
    working_dir: /dbt
    environment:
      # ── BigQuery 타깃용. 값은 루트 .env에서 주입(없으면 기본값) ──
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:?.env에 GCP_PROJECT_ID를 설정하세요}
      BQ_DATASET_SILVER: ${BQ_DATASET_SILVER:-fraud_silver}
      BQ_DATASET_GOLD: ${BQ_DATASET_GOLD:-fraud_gold}
      GCP_REGION: ${GCP_REGION:-asia-northeast3}
      GCP_KEYFILE: /credentials/service_account.json
    volumes:
      - ${HOST_PROJECT_DIR:-.}/dbt:/dbt
      - ${HOST_PROJECT_DIR:-.}/credentials:/credentials:ro
    networks:
      - fraud-net
    command: ["run", "--profiles-dir", "."]

  # CSV → Kafka Producer(컨테이너화, ★ 최종 전환 작업). profile 지정으로 `up`엔 안 뜸.
  # 스모크: docker compose --profile producer run --rm producer
  # 전량:   ... run --rm producer python producer.py --limit 0 --rate 0
  # producer는 GCP에 직접 쓰지 않는다 — 완결 신호(EOD 마커)는 Kafka 스트림에 실려
  # Connect를 거쳐 Bronze에 도달한다(지름길로 보낸 신호는 그 경로의 완료를 증명 못 함).
  producer:
    build:
      context: ${HOST_PROJECT_DIR:-.}/kafka
      dockerfile: Dockerfile
    image: fraud-producer:local
    profiles: ["producer"]
    working_dir: /app/kafka
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
    environment:
      # 컨테이너 내부 브로커 주소(호스트용 localhost:9092... 대신)
      KAFKA_BOOTSTRAP_SERVERS: "kafka1:29092,kafka2:29092,kafka3:29092"
      KAFKA_TOPIC: ${KAFKA_TOPIC:-transactions}
      RAW_CSV_PATH: /app/data/raw/Synthetic_Financial_datasets_log.csv
      # event_time(=step→절대시각) 계산 기준. airflow와 **같은 값**이어야 한다(위 x-airflow-common 참조).
      STEP_EPOCH: ${STEP_EPOCH:-2016-01-01 00:00:00}
    volumes:
      - ${HOST_PROJECT_DIR:-.}/kafka:/app/kafka
      - ${HOST_PROJECT_DIR:-.}/data:/app/data
    networks:
      - fraud-net
    command: ["python", "producer.py", "--limit", "1000"]

  # ── Airflow 스택 (⑤ 오케스트레이션, LocalExecutor) ──────────────────────
  airflow-postgres:
    image: postgres:13
    container_name: airflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fraud-net

  # DB 마이그레이션 + admin 유저 생성 후 종료
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create --username admin --password admin \
          --firstname admin --lastname user --role Admin --email admin@example.com || true
    depends_on:
      airflow-postgres:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    restart: unless-stopped
    command: webserver
    ports:
      - "8081:8080"   # kafka-ui가 8080 점유 → Airflow는 8081
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    restart: unless-stopped
    command: scheduler
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  # ── ⑥ 모니터링 스택 (profile=monitoring) ──────────────────────────────────
  # 기동: docker compose --profile monitoring up -d
  #   - Kafka 인제스트 헬스: kafka-exporter → Prometheus
  #   - Airflow 운영 메트릭: statsd-exporter → Prometheus
  #   - 배치 records + 사기 KPI: DAG가 Pushgateway로 push → Prometheus
  #   - 시각화: Grafana(단일 Prometheus 데이터소스, 대시보드/데이터소스 프로비저닝)

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ${HOST_PROJECT_DIR:-.}/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    networks:
      - fraud-net

  pushgateway:
    image: prom/pushgateway:v1.9.0
    container_name: pushgateway
    profiles: ["monitoring"]
    restart: unless-stopped
    # 영속화: 배치가 push한 메트릭을 파일로 보존 → Docker 재시작에도 유지(메모리 전용이면 소실).
    # user:root = 새 named volume(root 소유)에 nobody(uid 65534)가 쓰기 실패하는 이슈 회피(로컬 전용).
    user: root
    command:
      - --persistence.file=/data/pushgateway.store
      - --persistence.interval=1m
    ports:
      - "9091:9091"
    volumes:
      - pushgateway-data:/data
    networks:
      - fraud-net

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: kafka-exporter
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "9308:9308"
    command:
      - --kafka.server=kafka1:29092
      - --kafka.server=kafka2:29092
      - --kafka.server=kafka3:29092
    networks:
      - fraud-net

  statsd-exporter:
    image: prom/statsd-exporter:v0.27.1
    container_name: statsd-exporter
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "9102:9102"     # Prometheus scrape (HTTP)
      - "9125:9125/udp" # Airflow StatsD 수신 (UDP)
    volumes:
      - ${HOST_PROJECT_DIR:-.}/prometheus/statsd_mapping.yml:/etc/statsd/mapping.yml:ro
    command:
      - --statsd.mapping-config=/etc/statsd/mapping.yml
      - --statsd.listen-udp=:9125
      - --web.listen-address=:9102
    networks:
      - fraud-net

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ${HOST_PROJECT_DIR:-.}/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${HOST_PROJECT_DIR:-.}/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - fraud-net

volumes:
  kafka1-data:
  kafka2-data:
  kafka3-data:
  airflow-pg-data:
  prometheus-data:
  grafana-data:
  pushgateway-data:

networks:
  fraud-net:
    driver: bridge
