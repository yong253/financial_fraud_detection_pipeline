name: CD                      # dbt(Gold) 모델을 실제 BigQuery에 배포

"on":
  # 수동 실행 전용(Actions 탭 → CD → Run workflow).
  # 이전에는 CI 성공 시 자동 실행(workflow_run)이었으나, 배포 대상이 작성자 개인 GCP
  # 프로젝트라 포크·클론한 사람의 push에서 의미 있게 동작할 수 없다. 아래 Repository
  # Variables가 없으면 compose의 :? 가 발동해 실패하므로, master push마다 실패가 쌓였다.
  # 배포 파이프라인 자체는 그대로 두고 트리거만 수동으로 돌린다.
  workflow_dispatch:

jobs:
  deploy-dbt:
    runs-on: ubuntu-latest
    # 실제 배포 대상 — compose가 :? 로 필수화한 개인 GCP 값을 Repository Variables(시크릿 아님,
    # Settings → Secrets and variables → Actions → Variables)에서 가져온다. 미등록 시 빈 문자열이
    # 되어 :? 가 발동해 배포가 실패한다(작성자 프로젝트로 조용히 배포되는 것보다 안전).
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCS_BUCKET_BRONZE: ${{ vars.GCS_BUCKET_BRONZE }}
      GCS_BUCKET_SILVER: ${{ vars.GCS_BUCKET_SILVER }}
      GCS_BUCKET_STAGING: ${{ vars.GCS_BUCKET_STAGING }}
      GCP_SA_EMAIL: ${{ vars.GCP_SA_EMAIL }}
      FEED_DONE_URI: ${{ vars.FEED_DONE_URI }}

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4
        with:
          ref: master

      - name: GCP 서비스계정 키 복원 (CD 전용 최소권한 키, GitHub Secrets에서)
        run: |
          mkdir -p credentials
          echo "${{ secrets.GCP_SA_KEY_B64 }}" | base64 -d > credentials/service_account.json

      - name: dbt run (Gold 테이블 실제 배포)
        run: docker compose run --rm dbt run --profiles-dir .

      - name: dbt test (배포 직후 데이터 품질 검증)
        run: docker compose run --rm dbt test --profiles-dir .

      - name: 자격증명 정리
        if: always()
        run: rm -f credentials/service_account.json
